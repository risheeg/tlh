[project]
name = "tlh-backend"
version = "0.1.0"
description = "Tax Loss Harvesting backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "alembic>=1.13.0",
    "requests>=2.33.1",
    "google-auth>=2.29.0",
    "google-auth-httplib2>=0.2.0",
    "google-api-python-client>=2.126.0",
    "gspread>=6.1.0",
    "apscheduler>=3.10.4",
    "gspread-formatting>=1.2.1",
]

[project.scripts]
tlh = "scripts.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "db", "models", "routers", "schemas", "services", "scripts"]
