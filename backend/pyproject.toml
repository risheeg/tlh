[project]
name = "tlh-backend"
version = "0.1.0"
description = "Tax Loss Harvesting backend API"
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.9",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "alembic>=1.13.0",
    "requests>=2.33.1",
    "google-auth>=2.29.0",
    "google-auth-httplib2>=0.2.0",
    "google-api-python-client>=2.126.0",
    "gspread>=6.1.0",
    "apscheduler>=3.10.4",
    "gspread-formatting>=1.2.1",
]

[project.optional-dependencies]
dev = [
    "import-linter>=2.1",
    "pytest>=8.0",
]

[project.scripts]
tlh = "cli.main:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "db", "models", "routers", "schemas", "domains", "shared", "scripts", "cli", "scheduler"]

[tool.importlinter]
root_packages = [
    "core",
    "db",
    "models",
    "schemas",
    "shared",
    "domains",
    "routers",
    "scheduler",
    "cli",
]

[[tool.importlinter.contracts]]
name = "Models must not import domains, routers, schemas, or shared"
type = "forbidden"
source_modules = ["models"]
forbidden_modules = ["domains", "routers", "schemas", "shared", "scheduler", "cli"]

[[tool.importlinter.contracts]]
name = "Schemas must stay pure DTOs"
type = "forbidden"
source_modules = ["schemas"]
forbidden_modules = ["domains", "routers", "shared", "db", "scheduler", "cli"]

[[tool.importlinter.contracts]]
name = "Schemas must not import ORM model modules"
type = "forbidden"
source_modules = ["schemas"]
forbidden_modules = [
    "models.core",
    "models.portfolio",
    "models.taxes",
    "models.expenses",
    "models.documents",
    "models.user_settings",
]
# models.enums is allowed — shared value objects used by both ORM and DTOs.

[[tool.importlinter.contracts]]
name = "Shared must not import domains or routers"
type = "forbidden"
source_modules = ["shared"]
forbidden_modules = ["domains", "routers", "scheduler", "cli"]

[[tool.importlinter.contracts]]
name = "Portfolio must not import taxes, tlh, or expenses"
type = "forbidden"
source_modules = ["domains.portfolio"]
forbidden_modules = [
    "domains.taxes",
    "domains.tlh",
    "domains.expenses",
]

[[tool.importlinter.contracts]]
name = "Routers may not be imported by domains"
type = "forbidden"
source_modules = ["domains"]
forbidden_modules = ["routers", "scheduler", "cli"]
